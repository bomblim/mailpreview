<!DOCTYPE html>
<html lang="ko" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>10월 뉴스레터</title>
<!--[if mso]>
<xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml>
<style>td,th,div,p,a,h1,h2{font-family:"Malgun Gothic",Arial,sans-serif;}</style>
<![endif]-->
<style>
  body { margin:0; padding:0; background:#eef1f5; }
  .card { border-radius:12px; box-shadow:0 4px 18px rgba(0,0,0,.08); }
  .btn { border-radius:24px; }
  @media (max-width:620px) {
    .container { width:100% !important; }
    .col { display:block !important; width:100% !important; }
    .pad { padding:20px !important; }
  }
</style>
</head>
<body style="margin:0;padding:0;background:#eef1f5;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#eef1f5">
  <tr>
    <td align="center" style="padding:24px 12px;">
      <!--[if mso]><table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0"><tr><td><![endif]-->
      <table role="presentation" class="container card" width="600" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="width:600px;max-width:600px;background:#ffffff;">
        <tr>
          <td class="pad" style="padding:32px 40px 8px;font-family:'Malgun Gothic',Arial,sans-serif;">
            <p style="margin:0;font-size:13px;color:#6b7280;letter-spacing:1px;">OCTOBER 2026 · NEWSLETTER</p>
            <h1 style="margin:8px 0 0;font-size:26px;line-height:34px;color:#111827;">가을 업데이트 소식을 전해드립니다</h1>
          </td>
        </tr>
        <tr>
          <td class="pad" style="padding:16px 40px;font-family:'Malgun Gothic',Arial,sans-serif;font-size:15px;line-height:24px;color:#374151;">
            안녕하세요, 고객님. 이번 달에는 새로운 대시보드와 모바일 앱 개선 사항을 준비했습니다.
            아래 버튼을 눌러 자세한 내용을 확인해 보세요.
          </td>
        </tr>
        <tr>
          <td class="pad" style="padding:8px 40px 24px;">
            <!-- 2단 컬럼 -->
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td class="col" width="50%" valign="top" style="padding:0 8px 0 0;font-family:'Malgun Gothic',Arial,sans-serif;">
                  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f3f6ff">
                    <tr><td style="padding:16px;font-size:14px;line-height:21px;color:#1f2937;">
                      <strong style="color:#2b4fd8;">새 대시보드</strong><br>핵심 지표를 한눈에 확인할 수 있어요.
                    </td></tr>
                  </table>
                </td>
                <td class="col" width="50%" valign="top" style="padding:0 0 0 8px;font-family:'Malgun Gothic',Arial,sans-serif;">
                  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#fff6ec">
                    <tr><td style="padding:16px;font-size:14px;line-height:21px;color:#1f2937;">
                      <strong style="color:#c2570c;">모바일 앱</strong><br>로딩 속도가 2배 빨라졌습니다.
                    </td></tr>
                  </table>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:8px 40px 32px;">
            <!-- 둥근 버튼: 웹메일은 둥글게, Outlook은 각지게 보입니다 (border-radius 미지원) -->
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td class="btn" bgcolor="#2b4fd8" style="background:#2b4fd8;">
                  <a href="https://example.com" style="display:inline-block;padding:14px 32px;font-family:'Malgun Gothic',Arial,sans-serif;font-size:15px;font-weight:bold;color:#ffffff;text-decoration:none;">자세히 보기 →</a>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td style="padding:20px 40px;border-top:1px solid #e5e7eb;font-family:'Malgun Gothic',Arial,sans-serif;font-size:12px;line-height:18px;color:#9ca3af;">
            본 메일은 발신 전용입니다. 수신을 원하지 않으시면 <a href="https://example.com/unsubscribe" style="color:#6b7280;">수신거부</a>를 눌러주세요.
          </td>
        </tr>
      </table>
      <!--[if mso]></td></tr></table><![endif]-->
    </td>
  </tr>
</table>
</body>
</html>
